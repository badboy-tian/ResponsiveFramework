name: responsive_framework
description: Easily make Flutter apps responsive. Automatically adapt UI to different screen sizes. Responsiveness made simple.
# 新增 OHOS 原生接入，使用次版本号标识平台扩展。
version: 1.7.0
homepage: https://codelessly.com
repository: https://github.com/Codelessly/ResponsiveFramework
documentation: https://github.com/Codelessly/ResponsiveFramework

environment:
  # iPhone Duo 桥接依赖所需的最低工具链。
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  # 使用发布版本接入 iOS 姿态与保留区域，Android 保留引擎数据。
  foldable: ^1.0.5
  collection: ^1.16.0 # Do not force latest version to prevent dependency conflicts.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# OH SDK 使用此注册项装载 ArkTS 插件，其他平台继续使用 Dart 与 iOS 依赖。
flutter:
  plugin:
    platforms:
      ohos:
        package: ets.components.plugin
        pluginClass: ResponsiveFrameworkPlugin
